name: Generate Playwright Tests

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: 'Kiwi TCMS case IDs (comma-separated, e.g. C291,C292)'
        required: true
        type: string
      skip_run:
        description: 'Skip test execution (generate only)'
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types: [generate-tests]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout generator repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Checkout target test repo
        uses: actions/checkout@v4
        with:
          repository: silkroadeng/recruiting-playwright-ui-tests
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target-repo

      - name: Run pipeline
        env:
          KIWI_URL: ${{ secrets.KIWI_URL }}
          KIWI_USER: ${{ secrets.KIWI_USER }}
          KIWI_PASSWORD: ${{ secrets.KIWI_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: claude-sonnet-4-20250514
          TARGET_REPO_PATH: ./target-repo
          MAX_RETRIES: 5
          DEBUG: true
        run: |
          CASE_IDS="${{ github.event.inputs.case_ids || github.event.client_payload.case_ids }}"
          SKIP_FLAG=""
          if [ "${{ github.event.inputs.skip_run }}" = "true" ]; then
            SKIP_FLAG="--skip-run"
          fi
          node orchestrator/pipeline.js --case-id "$CASE_IDS" $SKIP_FLAG

      - name: Create PR with generated tests
        if: success()
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          CASE_IDS="${{ github.event.inputs.case_ids || github.event.client_payload.case_ids }}"
          BRANCH="auto/generated-tests-${CASE_IDS//,/-}"

          git config user.name "Test Generator Bot"
          git config user.email "bot@silkroad-eng.com"
          git checkout -b "$BRANCH"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "feat: auto-generated tests for $CASE_IDS"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Auto-generated tests: $CASE_IDS" \
            --body "Generated by Test Generator Agents pipeline.\n\nCase IDs: $CASE_IDS\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: output/reports/
          retention-days: 30

      - name: Upload generated code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: output/generated/
          retention-days: 30
